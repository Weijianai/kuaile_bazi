function getG(dm,tg){
    const yy={"甲":1,"丙":1,"戊":1,"庚":1,"壬":1,"乙":0,"丁":0,"己":0,"辛":0,"癸":0};
    let e1=E[dm], e2=E[tg], same=yy[dm]==yy[tg];
    const gen={moc:"hoa",hoa:"tho",tho:"kim",kim:"thuy",thuy:"moc"}, khac={moc:"tho",tho:"thuy",thuy:"hoa",hoa:"kim",kim:"moc"};
    if(e1==e2) return same?"Tỷ Kiên":"Kiếp Tài";
    if(gen[e1]==e2) return same?"Thực Thần":"Thương Quan";
    if(khac[e1]==e2) return same?"Thiên Tài":"Chính Tài";
    if(khac[e2]==e1) return same?"Thất Sát":"Chính Quan";
    if(gen[e2]==e1) return same?"Thiên Ấn":"Chính Ấn";
}

function getVTS(can, zhi) {
    const sPos={"甲":"亥","丙":"寅","戊":"寅","庚":"巳","壬":"申","乙":"午","丁":"酉","己":"酉","辛":"子","癸":"卯"};
    const isY=["甲","丙","戊","庚","壬"].includes(can);
    let sIdx=ZHIS.indexOf(sPos[can]), tIdx=ZHIS.indexOf(zhi);
    let d=isY?(tIdx-sIdx+12)%12:(sIdx-tIdx+12)%12;
    return TS_L[d];
}

// ===== THÁNG VƯỢNG / TƯỚNG / TỬ / TÙ / HƯU =====
// Sức mạnh của từng hành theo tháng (tháng = địa chi tháng)
// Mức: 5=Vượng, 4=Tướng, 3=Sinh, 2=Hưu, 1=Tù, 0=Tử
const SEASON_STRENGTH = {
    moc:  {"寅":5,"卯":5,"辰":4,"巳":2,"午":2,"未":2,"申":1,"酉":1,"戌":1,"亥":3,"子":3,"丑":2},
    hoa:  {"寅":3,"卯":3,"辰":2,"巳":5,"午":5,"未":4,"申":2,"酉":2,"戌":2,"亥":1,"子":1,"丑":1},
    tho:  {"寅":2,"卯":1,"辰":5,"巳":3,"午":3,"未":5,"申":2,"酉":1,"戌":5,"亥":2,"子":1,"丑":5},
    kim:  {"寅":1,"卯":1,"辰":2,"巳":1,"午":1,"未":2,"申":5,"酉":5,"戌":4,"亥":3,"子":3,"丑":2},
    thuy: {"寅":2,"卯":2,"辰":2,"巳":1,"午":1,"未":1,"申":3,"酉":3,"戌":2,"亥":5,"子":5,"丑":4}
};

function calcNguHanh(b){
    let nh = {kim:0, moc:0, thuy:0, hoa:0, tho:0};
    const cans = [b.getYearGan(), b.getMonthGan(), b.getDayGan(), b.getTimeGan()];
    const zhis = [b.getYearZhi(), b.getMonthZhi(), b.getDayZhi(), b.getTimeZhi()];

    // Can: trọng số 3 mỗi can
    cans.forEach(c => { if(E[c]) nh[E[c]] += 3; });

    // Chi: cộng tàng can với trọng số bản/trung/dư khí
    zhis.forEach(z => {
        (TANG_CAN_WEIGHTS[z] || []).forEach(([tc, w]) => {
            if(E[tc]) nh[E[tc]] += w;
        });
    });

    return nh;
}

// ===== THÂN VƯỢNG / NHƯỢC =====
// Đánh giá sức mạnh Nhật Chủ dựa trên:
// 1. Sức mạnh theo tháng (Nguyệt Lệnh — quan trọng nhất)
// 2. Số lượng can chi trong lá số hỗ trợ (Tỷ/Kiếp/Ấn)
function calcThanLuc(b){
    const dm    = b.getDayGan();
    const dmE   = E[dm];
    const mZhi  = b.getMonthZhi();

    const SINH_DAM = {moc:"thuy", hoa:"moc", tho:"hoa", kim:"tho", thuy:"kim"};
    const supportE = [dmE, SINH_DAM[dmE]]; // Tỷ/Kiếp + Ấn/Kiêu

    // Điểm tháng lệnh (0-10)
    const monthScore = (SEASON_STRENGTH[dmE]?.[mZhi] || 2) * 2; // 0..10

    // Đếm can chi hỗ trợ (không kể Nhật Can)
    const allStems = [b.getYearGan(), b.getMonthGan(), b.getTimeGan()];
    const allBranches = [b.getYearZhi(), b.getMonthZhi(), b.getDayZhi(), b.getTimeZhi()];

    let supportPts = 0;
    allStems.forEach(c => { if(c !== dm && E[c] && supportE.includes(E[c])) supportPts += 3; });
    allBranches.forEach(z => {
        (TANG_CAN_WEIGHTS[z] || []).forEach(([tc, w]) => {
            if(E[tc] && supportE.includes(E[tc])) supportPts += Math.floor(w/2);
        });
    });

    const total = monthScore + supportPts;
    // Phân loại: >=20 Vượng, 14-19 Trung bình, <14 Nhược
    let level, label, color, advice;
    if(total >= 22){
        level="vuong"; label="Thân Cực Vượng 💪"; color="#ef4444";
        advice="Nhật Chủ quá mạnh. Dụng Thần ưu tiên: Quan Sát (kiềm chế), Tài Tinh (tiêu hao), Thực Thần/Thương Quan (tiết khí).";
    } else if(total >= 15){
        level="trung_vuong"; label="Thân Vượng 🔥"; color="#f97316";
        advice="Nhật Chủ mạnh. Dụng Thần ưu tiên: Quan Sát, Tài Tinh để điều tiết, hạn chế dùng Ấn Tinh.";
    } else if(total >= 10){
        level="trung"; label="Trung Bình ⚖️"; color="#3b82f6";
        advice="Nhật Chủ ở mức trung hòa. Dụng Thần tùy trường hợp, ưu tiên điều hòa ngũ hành yếu.";
    } else if(total >= 5){
        level="trung_nhuoc"; label="Thân Nhược 🌱"; color="#10b981";
        advice="Nhật Chủ yếu. Dụng Thần ưu tiên: Ấn Tinh/Kiêu Thần (sinh trợ), Tỷ Kiếp (trợ thân). Tránh Quan Sát, Tài Tinh.";
    } else {
        level="nhuoc"; label="Thân Cực Nhược 🥀"; color="#8b5cf6";
        advice="Nhật Chủ quá yếu. Cần mạnh mẽ trợ thân: Ấn, Kiêu, Tỷ Kiếp. Hoặc xét theo Tòng Cách (thuận theo vượng khí).";
    }

    return {total, monthScore, supportPts, level, label, color, advice};
}

function findDungThan(nguhanh, thanLucLevel, dmE){
    const SINH_MAP = {kim:"thuy", thuy:"moc", moc:"hoa", hoa:"tho", tho:"kim"};
    const KHAC_MAP = {kim:"moc",  moc:"tho",  tho:"thuy",thuy:"hoa", hoa:"kim"};
    // Hành nào SINH ra dmE (Ấn Kiêu)
    const SINH_BY  = {moc:"thuy", hoa:"moc", tho:"hoa", kim:"tho", thuy:"kim"};
    // Hành nào KHẮC dmE (Quan Sát)
    const KHAC_BY  = {moc:"kim",  hoa:"thuy", tho:"moc", kim:"hoa", thuy:"tho"};

    let vuong = Object.entries(nguhanh).sort((a,b)=>b[1]-a[1])[0][0];
    let suy   = Object.entries(nguhanh).sort((a,b)=>a[1]-b[1])[0][0];
    let dungThan, hyThan, kyThan, note;

    if(thanLucLevel === "vuong" || thanLucLevel === "trung_vuong"){
        // Thân mạnh → kiềm chế hoặc tiêu hao Nhật Chủ
        dungThan = KHAC_BY[dmE];      // Quan/Sát — hành khắc Nhật Chủ
        hyThan   = SINH_MAP[dmE];     // Thực/Thương — hành Nhật Chủ sinh ra (tiết hao)
        kyThan   = SINH_BY[dmE];      // Ấn/Kiêu — càng sinh trợ thêm → tránh
        note = `Nhật Chủ (${NGU_HANH_NAME[dmE]}) vượng — ưu tiên ${NGU_HANH_NAME[dungThan]} (Quan/Sát) để kiềm chế, và ${NGU_HANH_NAME[hyThan]} (Thực/Thương) để tiết hao. Hạn chế ${NGU_HANH_NAME[kyThan]} (Ấn) vì càng trợ thân.`;
    } else if(thanLucLevel === "nhuoc" || thanLucLevel === "trung_nhuoc"){
        // Thân yếu → sinh trợ Nhật Chủ
        dungThan = SINH_BY[dmE];      // Ấn/Kiêu — hành sinh Nhật Chủ
        hyThan   = dmE;               // Tỷ/Kiếp — cùng hành
        kyThan   = KHAC_BY[dmE];      // Quan/Sát — hành khắc Nhật Chủ → tránh
        note = `Nhật Chủ (${NGU_HANH_NAME[dmE]}) nhược — ưu tiên ${NGU_HANH_NAME[dungThan]} (Ấn/Kiêu) để sinh trợ, và ${NGU_HANH_NAME[hyThan]} (Tỷ/Kiếp) để trợ thân. Hạn chế ${NGU_HANH_NAME[kyThan]} (Quan/Sát).`;
    } else {
        // Trung hòa → bổ sung hành đang suy yếu
        dungThan = SINH_BY[suy];
        hyThan   = suy;
        kyThan   = KHAC_BY[suy];
        note = `Nhật Chủ (${NGU_HANH_NAME[dmE]}) trung hòa — bổ sung ${NGU_HANH_NAME[dungThan]} để cân bằng hành ${NGU_HANH_NAME[suy]} đang thiếu.`;
    }

    return {dungThan, hyThan, kyThan, note, dmE, vuong, suy};
}

function renderElementUI(nguhanh){
    let total = Object.values(nguhanh).reduce((a,b)=>a+b, 0);
    let values = Object.values(nguhanh);
    let maxVal = Math.max(...values);
    let minVal = Math.min(...values);

    const rows = [
        {key:"kim", cls:"e-kim"},
        {key:"moc", cls:"e-moc"},
        {key:"thuy",cls:"e-thuy"},
        {key:"hoa", cls:"e-hoa"},
        {key:"tho", cls:"e-tho"}
    ];

    let html = rows.map(r => {
        let val     = nguhanh[r.key];
        let percent = total ? Math.round((val/total)*100) : 0;
        let isMax   = val === maxVal;
        let isMin   = val === minVal;
        let comment = isMin ? NH_COMMENT[r.key]?.thieu : (isMax ? NH_COMMENT[r.key]?.du : "");
        return `
        <div style="margin-bottom:${comment?'14px':'6px'}">
            <div class="score-row">
                <div class="score-label">
                    ${NGU_HANH_NAME[r.key]}
                    ${isMax ? "🔥" : ""}${isMin ? "⚠️" : ""}
                </div>

                    <div class="score-fill ${r.cls} ${isMax?'vuong':isMin?'suy':''}" style="width:${percent}%"></div>
                </div>

        </div>`;
    }).join('');

    return html;
}

function scoreBalance(c){
    let vals = Object.values(c);
    let total = vals.reduce((a,b)=>a+b, 0);
    if(!total) return 15;
    let max = Math.max(...vals) / total;
    let min = Math.min(...vals) / total;
    let diff = max - min; // tỷ lệ 0..1

    if(diff <= 0.10) return 30;
    if(diff <= 0.20) return 25;
    if(diff <= 0.32) return 18;
    if(diff <= 0.48) return 10;
    return 5;
}

function scoreDayMaster(b){
    const dm = b.getDayGan();
    const month = b.getMonthZhi();

    const support = {
        moc:["寅","卯"],
        hoa:["巳","午"],
        tho:["辰","戌","丑","未"],
        kim:["申","酉"],
        thuy:["亥","子"]
    };

    let dmE = E[dm];
    let score = 20;

    if(support[dmE] && support[dmE].includes(month)){
        score += 15;
    }

    return score;
}

function scoreUsefulGod(c, dm){
    let dmE = E[dm];
    const gen={moc:"hoa",hoa:"tho",tho:"kim",kim:"thuy",thuy:"moc"};
    let need = gen[dmE];
    let total = Object.values(c).reduce((a,b)=>a+b, 0);
    let ratio = total ? c[need] / total : 0;

    if(ratio >= 0.25) return 20;
    if(ratio >= 0.15) return 12;
    return 5;
}

function scoreThanSat(list){
    let score = 0;

    list.forEach(s=>{
        if(["Thiên Ất","Thiên Đức","Nguyệt Đức","Phúc Đức"].includes(s)){
            score += 2;
        }
        if(["Kiếp Sát","Tai Sát","Cô Thần","Quả Tú","Thập Ác"].includes(s)){
            score -= 2;
        }
    });

    if(score > 10) score = 10;
    if(score < 0) score = 0;

    return score;
}

function calcScore(b, thanSatList){
    // Dùng calcNguHanh (đã tính cả tàng can) thay cho countElements đã bị xóa
    const c = calcNguHanh(b);

    let s1 = scoreBalance(c);
    let s2 = scoreDayMaster(b);
    let s3 = scoreUsefulGod(c, b.getDayGan());
    let s4 = scoreThanSat(thanSatList);

    let total = s1 + s2 + s3 + s4;

    return {
        total,
        detail:{
            balance:s1,
            dayMaster:s2,
            useful:s3,
            thanSat:s4
        }
    };
}

function renderScoreUI(score){

    const max = 60; // 🔥 scale theo thực tế của bạn (59 max)

}

// Quan hệ Xung / Hợp / Hình / Hại / Phá địa chi
const XUNG_CHI = {"子":"午","午":"子","丑":"未","未":"丑","寅":"申","申":"寅","卯":"酉","酉":"卯","辰":"戌","戌":"辰","巳":"亥","亥":"巳"};
const HOP_CHI  = {"子":"丑","丑":"子","寅":"亥","亥":"寅","卯":"戌","戌":"卯","辰":"酉","酉":"辰","巳":"申","申":"巳","午":"未","未":"午"};
const HINH_CHI = {"寅":"巳","巳":"申","申":"寅","丑":"戌","戌":"未","未":"丑","子":"卯","卯":"子","辰":"辰","午":"午","酉":"酉","亥":"亥"};
// Tam hợp cục
const TAMHOP = [["申","子","辰"],["寅","午","戌"],["亥","卯","未"],["巳","酉","丑"]];
// Lục hợp
const LUCHOP = {"子":"丑","丑":"子","寅":"亥","亥":"寅","卯":"戌","戌":"卯","辰":"酉","酉":"辰","巳":"申","申":"巳","午":"未","未":"午"};

function getChiRelation(chi1, chi2){
    let rel = [];
    if(XUNG_CHI[chi1] === chi2) rel.push({text:"Xung", cls:"tag-xau", icon:"⚡"});
    if(HOP_CHI[chi1]  === chi2) rel.push({text:"Lục Hợp", cls:"tag-tot", icon:"🤝"});
    if(HINH_CHI[chi1] === chi2) rel.push({text:"Hình", cls:"tag-xau", icon:"⚠️"});
    if(LUCHOP[chi1]   === chi2) rel.push({text:"Hợp", cls:"tag-tot", icon:"✨"});
    // Tam hợp một phần
    for(let g of TAMHOP){
        if(g.includes(chi1) && g.includes(chi2)) rel.push({text:"Tam Hợp", cls:"tag-tot", icon:"🌟"});
    }
    if(rel.length===0) rel.push({text:"Bình", cls:"tag-trung", icon:"➖"});
    return rel;
}

    return getG(dm, can) || "—";
}

// ── LUẬN ĐẠI VẬN HIỆN TẠI ──
function luanDaiVan(dm, b, sA_fix, dir_fix, currentYear, birthYear){
    const dmE = E[dm];
    // Tính Đại Vận hiện tại
    let activeDV = null;
    for(let i=0; i<8; i++){
        const cI = (CANS.indexOf(b.getMonthGan()) + dir_fix*(i+1) + 10) % 10;
        const zI = (ZHIS.indexOf(b.getMonthZhi()) + dir_fix*(i+1) + 12) % 12;
        const ageStart = sA_fix + i*10;
        const yearStart = birthYear + ageStart;
        if(currentYear >= yearStart && currentYear < yearStart+10){
            activeDV = { can: CANS[cI], zhi: ZHIS[zI], ageStart, yearStart, idx: i };
            break;
        }
    }

    if(!activeDV){
        // Chưa vào đại vận hoặc hết đại vận
        const firstAge = sA_fix;
        const firstYear = birthYear + firstAge;
        if(currentYear < firstYear){
            return `<div class="lg-block" style="border-left-color:#aaa">
                <div class="lg-block-title">⏳ Chưa Khởi Vận</div>
                <p>Chủ nhân lá số chưa bước vào Đại Vận đầu tiên. Đại Vận đầu sẽ bắt đầu năm <b>${firstYear}</b> (${firstAge} tuổi).</p>
                <p style="color:#888;font-size:13px">Trong giai đoạn trước Đại Vận, cuộc sống chịu ảnh hưởng chính từ Trụ Năm và môi trường gia đình.</p>
            </div>`;
        }
        return `<div class="lg-block" style="border-left-color:#aaa"><div class="lg-block-title">ℹ️ Ngoài phạm vi 8 Đại Vận tính toán</div></div>`;
    }

    const ttCan = getThapThanName(dm, activeDV.can);
    const ynDV  = DV_THAPNTHAN_Y_NGHIA[ttCan] || DV_THAPNTHAN_Y_NGHIA["Tỷ Kiên"];
    const ageNow = currentYear - birthYear;
    const ageInDV = ageNow - activeDV.ageStart;

    // Quan hệ địa chi Đại Vận với các trụ gốc
    const dayZhi   = b.getDayZhi();
    const monthZhi = b.getMonthZhi();
    const yearZhi  = b.getYearZhi();
    const timeZhi  = b.getTimeZhi();

    const relDay   = getChiRelation(activeDV.zhi, dayZhi);
    const relMonth = getChiRelation(activeDV.zhi, monthZhi);
    const relYear  = getChiRelation(activeDV.zhi, yearZhi);

    // Thập thần của Can Đại Vận
    const ttCanHtml = `<span class="lg-tag tag-trung">${ttCan}</span>`;

    // Render quan hệ chi
    function renderRel(rels, label){
        return rels.map(r=>`<span class="lg-tag ${r.cls}">${r.icon} ${r.text} ${label}</span>`).join(' ');
    }

    let chiRelHtml = "";
    const hasXung  = [...relDay,...relMonth,...relYear].some(r=>r.text==="Xung");
    const hasHop   = [...relDay,...relMonth,...relYear].some(r=>r.text.includes("Hợp")||r.text.includes("Hợp"));
    const hasHinh  = [...relDay,...relMonth,...relYear].some(r=>r.text==="Hình");

    chiRelHtml += `<div style="margin:8px 0 4px;font-size:13px;font-weight:700;color:#555">Địa Chi Đại Vận <b class="${E[activeDV.zhi]}">${VN[activeDV.zhi]}</b> tác động:</div>`;
    chiRelHtml += `<div style="margin-bottom:6px">${renderRel(relDay,"Nhật Chi")} ${renderRel(relMonth,"Nguyệt Chi")} ${renderRel(relYear,"Niên Chi")}</div>`;

    // Lời giải thích xung/hợp
    let chiNote = "";
    if(hasXung)  chiNote += `<div style="color:#dc2626;font-size:13px;margin-top:4px">⚡ Có xung địa chi — giai đoạn này dễ có thay đổi lớn, biến động về chỗ ở, công việc, hoặc tình cảm. Cần chuẩn bị tâm lý và dự phòng tài chính tốt.</div>`;
    if(hasHinh)  chiNote += `<div style="color:#dc2626;font-size:13px;margin-top:4px">⚠️ Có hình địa chi — cần chú ý sức khỏe, tránh tranh chấp pháp lý và mâu thuẫn không đáng.</div>`;
    if(hasHop)   chiNote += `<div style="color:#16a34a;font-size:13px;margin-top:4px">✨ Có hợp địa chi — môi trường hỗ trợ tốt, dễ gặp quý nhân và cơ hội trong giai đoạn này.</div>`;

    let html = "";

    // Block tiêu đề đại vận
    html += `<div class="lg-block" style="border-left-color:#7d441e;background:linear-gradient(135deg,#fdfaf8,#fff8f0)">
        <div class="lg-block-title" style="font-size:17px">
            🔮 Đại Vận ${VN[activeDV.can]} ${VN[activeDV.zhi]} 
            <span style="font-size:13px;font-weight:400;color:#888">(${activeDV.yearStart}–${activeDV.yearStart+9} · Năm ${activeDV.ageStart}–${activeDV.ageStart+9} tuổi)</span>
        </div>
        <div style="margin-bottom:10px">
            ${ttCanHtml}
            <span class="lg-tag tag-trung">Năm thứ ${ageInDV+1}/10 của vận</span>
            <span class="lg-tag ${E[activeDV.can]==='moc'?'tag-tot':E[activeDV.can]==='hoa'?'tag-xau':'tag-trung'}">
                Hành ${NGU_HANH_NAME[E[activeDV.can]]}
            </span>
        </div>
        <div style="line-height:1.8;font-size:14px">${ynDV.tong_quat}</div>
        ${chiRelHtml}${chiNote}
    </div>`;

    // 4 block chi tiết
    const blocks = [
        {icon:"💼", title:"Sự Nghiệp & Công Việc", content: ynDV.su_nghiep, color:"#0077b6"},
        {icon:"💰", title:"Tài Chính & Đầu Tư",    content: ynDV.tai_chinh, color:"#f59e0b"},
        {icon:"💑", title:"Tình Cảm & Gia Đình",   content: ynDV.tinh_cam,  color:"#e91e8c"},
        {icon:"❤️", title:"Sức Khỏe",               content: ynDV.suc_khoe,  color:"#ef4444"},
    ];
    blocks.forEach(bk => {
        html += lgBlock(bk.icon, bk.title, bk.content, bk.color);
    });

    // Tổng kết nhanh
    const isTot = ["Thực Thần","Chính Ấn","Chính Quan","Chính Tài"].includes(ttCan);
    const isXau = ["Kiếp Tài","Thất Sát","Thương Quan"].includes(ttCan) && !hasHop;
    html += lgBlock("📌","Nhận Định Chung Giai Đoạn Này",
        isTot
            ? `Đây là <b style="color:#16a34a">giai đoạn thuận lợi</b> trong cuộc đời. Hãy tận dụng tối đa cơ hội, mở rộng quan hệ và đầu tư vào bản thân. Năm ${activeDV.yearStart + 3}–${activeDV.yearStart + 7} thường là đỉnh điểm của vận này.`
            : isXau
            ? `Đây là <b style="color:#dc2626">giai đoạn cần thận trọng</b>. Hãy tập trung phòng thủ, củng cố nền tảng, tránh mạo hiểm lớn. Vận khó thường là bàn đạp để vận sau tốt hơn nếu biết chuẩn bị.`
            : `Đây là <b style="color:#ca8a04">giai đoạn trung bình</b> — không quá thuận cũng không quá khó. Kết quả phụ thuộc nhiều vào nỗ lực cá nhân và Lưu Niên hàng năm.`,
        isTot ? "#16a34a" : isXau ? "#ef4444" : "#f59e0b");

    return html;
}

// ── LUẬN LƯU NIÊN NĂM XEM ──
function luanLuuNien(dm, b, currentYear){
    const dmE = E[dm];
    const l_lunar = Lunar.fromSolar(Solar.fromYmd(currentYear, 6, 15));
    const lnCan = l_lunar.getYearGan();
    const lnZhi = l_lunar.getYearZhi();

    const ttLN = getThapThanName(dm, lnCan);
    const ynLN = DV_THAPNTHAN_Y_NGHIA[ttLN] || DV_THAPNTHAN_Y_NGHIA["Tỷ Kiên"];

    // Quan hệ Địa Chi lưu niên với các trụ gốc
    const dayZhi   = b.getDayZhi();
    const monthZhi = b.getMonthZhi();
    const yearZhi  = b.getYearZhi();
    const timeZhi  = b.getTimeZhi();

    const relDay   = getChiRelation(lnZhi, dayZhi);
    const relMonth = getChiRelation(lnZhi, monthZhi);
    const relYear  = getChiRelation(lnZhi, yearZhi);
    const relTime  = getChiRelation(lnZhi, timeZhi);

    const hasXung = [...relDay,...relMonth,...relYear,...relTime].some(r=>r.text==="Xung");
    const hasHop  = [...relDay,...relMonth,...relYear,...relTime].some(r=>r.text.includes("Hợp"));
    const hasHinh = [...relDay,...relMonth,...relYear,...relTime].some(r=>r.text==="Hình");

    // Tháng tốt/xấu trong năm (dựa trên quan hệ Nguyệt Chi)
    function getMonthAdvice(){
        const MONTH_CHI = ["寅","卯","辰","巳","午","未","申","酉","戌","亥","子","丑"]; // tháng 1-12
        let totThang=[], xuatThang=[];
        MONTH_CHI.forEach((mc, idx) => {
            const rels = getChiRelation(lnZhi, mc);
            const isHop  = rels.some(r=>r.text.includes("Hợp"));
            const isXung = rels.some(r=>r.text==="Xung"||r.text==="Hình");
            if(isHop)  totThang.push(`Tháng ${idx+1}`);
            if(isXung) xuatThang.push(`Tháng ${idx+1}`);
        });
        return {totThang, xuatThang};
    }
    const {totThang, xuatThang} = getMonthAdvice();

    function renderRel(rels, label){
        return rels.map(r=>`<span class="lg-tag ${r.cls}">${r.icon} ${r.text} ${label}</span>`).join(' ');
    }

    let html = "";

    // Block tiêu đề năm
    const napAmLN = NAP_AM[lnCan+lnZhi]||"";
    html += `<div class="lg-block" style="border-left-color:#7d441e;background:linear-gradient(135deg,#f0f9ff,#fff)">
        <div class="lg-block-title" style="font-size:17px">
            📅 Lưu Niên ${currentYear} — <span class="${E[lnCan]}">${VN[lnCan]}</span> <span class="${E[lnZhi]}">${VN[lnZhi]}</span>
            ${napAmLN ? `<span style="font-size:12px;font-weight:400;color:#888;margin-left:6px">(${napAmLN})</span>` : ""}
        </div>
        <div style="margin-bottom:10px">
            <span class="lg-tag tag-trung">${ttLN}</span>
            <span class="lg-tag tag-trung">Hành ${NGU_HANH_NAME[E[lnCan]]||""}</span>
        </div>
        <div style="line-height:1.8;font-size:14px">${ynLN.tong_quat.replace("Đại Vận","Lưu Niên")}</div>
        <div style="margin-top:12px">
            <div style="font-size:13px;font-weight:700;color:#555;margin-bottom:5px">Địa Chi Năm <b class="${E[lnZhi]}">${VN[lnZhi]}</b> tác động lá số:</div>
            <div>${renderRel(relDay,"Nhật Chi")} ${renderRel(relMonth,"Nguyệt Chi")} ${renderRel(relYear,"Niên Chi")} ${renderRel(relTime,"Thời Chi")}</div>
        </div>
        ${hasXung ? `<div style="color:#dc2626;font-size:13px;margin-top:8px">⚡ Năm có xung địa chi — dễ có biến động lớn trong năm này. Giữ thái độ bình tĩnh, tránh đưa ra quyết định lớn khi cảm xúc chưa ổn định.</div>`:""}
        ${hasHinh ? `<div style="color:#dc2626;font-size:13px;margin-top:8px">⚠️ Năm có hình địa chi — cẩn thận sức khỏe, tranh chấp và rủi ro pháp lý.</div>`:""}
        ${hasHop  ? `<div style="color:#16a34a;font-size:13px;margin-top:8px">✨ Năm có hợp địa chi — cơ hội và quý nhân xuất hiện, năm thuận lợi.</div>`:""}
    </div>`;

    // 4 block chi tiết năm
    html += lgBlock("💼","Sự Nghiệp Năm " + currentYear,
        ynLN.su_nghiep.replace("giai đoạn này","năm "+currentYear), "#0077b6");
    html += lgBlock("💰","Tài Chính Năm " + currentYear,
        ynLN.tai_chinh.replace("giai đoạn này","năm "+currentYear), "#f59e0b");
    html += lgBlock("💑","Tình Cảm & Gia Đình Năm " + currentYear,
        ynLN.tinh_cam.replace("giai đoạn này","năm "+currentYear), "#e91e8c");
    html += lgBlock("❤️","Sức Khỏe Năm " + currentYear,
        ynLN.suc_khoe.replace("giai đoạn này","năm "+currentYear), "#ef4444");

    // Tháng tốt/xấu
    if(totThang.length || xuatThang.length){
        html += lgBlock("🗓️","Tháng Tốt & Tháng Cần Thận Trọng",
            `${totThang.length ? `<b style="color:#16a34a">✅ Tháng thuận lợi:</b> ${totThang.join(", ")}<br>` : ""}
            ${xuatThang.length ? `<b style="color:#dc2626">⚠️ Tháng cần thận trọng:</b> ${xuatThang.join(", ")}` : ""}
            <div style="font-size:12px;color:#888;margin-top:6px">*Tính theo quan hệ địa chi hàng tháng với lưu niên. Chỉ mang tính tham khảo, cần kết hợp với Lưu Nguyệt chính xác hơn.</div>`,
            "#5a67d8");
    }

    return html;
}

    return `<div class="lg-block" style="border-left-color:${borderColor||'#7d441e'}">
        <div class="lg-block-title">${icon} ${title} ${tag||''}</div>

function run() {
    try {
        const y=parseInt(yIn.value), m=parseInt(mIn.value), d=parseInt(dIn.value), h=parseInt(document.getElementById('hIn').value);
        const gNam = parseInt(document.querySelector('#sexGroup .active').dataset.val);
        const isAm = document.querySelector('#calendarGroup .active').dataset.val === 'lunar';
        
        document.getElementById("res").style.display="block";
        let solar = isAm ? Lunar.fromYmd(y,m,d).getSolar() : Solar.fromYmdHms(y,m,d,h,0,0);
        const lunar = Lunar.fromSolar(solar), b = lunar.getEightChar(), dm = b.getDayGan();

        // 1. GRID HIỂN THỊ
        document.getElementById("grid").innerHTML=[{l:"Trụ Giờ",c:b.getTimeGan(),z:b.getTimeZhi()},{l:"Nhật Chủ",c:b.getDayGan(),z:b.getDayZhi(),m:1},{l:"Trụ Tháng",c:b.getMonthGan(),z:b.getMonthZhi()},{l:"Trụ Năm",c:b.getYearGan(),z:b.getYearZhi()}].map(x=>`<div class="pillar ${x.m?'nhat-chu-box':''}">
            <div class="form-label" style="color:#555; margin-bottom:10px;">${x.l}</div>
            <div style="font-size:16px; font-weight:800; color:#999; margin-bottom:15px;">${x.m?'NHẬT CHỦ':getG(dm,x.c)}</div>
            <div class="can-val ${E[x.c]}">${VN[x.c]}</div><div class="chi-val ${E[x.z]}">${VN[x.z]}</div>
            <div class="ts-badge">${getVTS(dm,x.z)}</div>
            <div class="nap-am-text">${NAP_AM[x.c+x.z]||""}</div>
            <div class="tang-box">${HD[x.z].map(c=>`<div class="${E[c]}">${VN[c]} <small style="color:#aaa;font-weight:400;font-size:14px;">(${getG(dm,c)})</small></div>`).join('')}</div>
        </div>`).join('');

        // 2. EXTRA INFO
        document.getElementById("oThai").innerText = VN[CANS[(CANS.indexOf(b.getMonthGan())+1)%10]]+" "+VN[ZHIS[(ZHIS.indexOf(b.getMonthZhi())+3)%12]];
        // ===== MỆNH CUNG (công thức chuẩn) =====
        // Số tháng âm lịch thực (1-12)
        const thangAL = lunar.getMonth();
        // Số thứ tự địa chi giờ (Tý=1, Sửu=2, ..., Hợi=12)
        const gioAL = ZHIS.indexOf(b.getTimeZhi()) + 1;
        // Địa chi Mệnh Cung: 14 - tháng - giờ
        let mcZhiNum = 14 - thangAL - gioAL;
        while(mcZhiNum <= 0) mcZhiNum += 12;
        while(mcZhiNum > 12) mcZhiNum -= 12;
        const mcZhi = ZHIS[mcZhiNum - 1];
        // Thiên can Mệnh Cung theo Ngũ Hổ Độn Niên
        // Giáp/Kỷ → Bính Dần, Ất/Canh → Mậu Dần, Bính/Tân → Canh Dần, Đinh/Nhâm → Nhâm Dần, Mậu/Quý → Giáp Dần
        const NHD_BASE = [2, 4, 6, 8, 0]; // index trong CANS: Bính=2,Mậu=4,Canh=6,Nhâm=8,Giáp=0
        const nienCanGroup = CANS.indexOf(b.getYearGan()) % 5;
        const baseCan = NHD_BASE[nienCanGroup]; // can của tháng Dần (tháng 1)
        // Từ tháng Dần (index 2 trong ZHIS) đến mcZhi, can tăng dần
        const mcCanIdx = (baseCan + (mcZhiNum - 1)) % 10;
        const mcC = CANS[mcCanIdx];
        document.getElementById("oMCung").innerText = VN[mcC]+" "+VN[mcZhi];
        const kv=(c,z)=>VN[ZHIS[(ZHIS.indexOf(z)-CANS.indexOf(c)+22)%12]]+"-"+VN[ZHIS[(ZHIS.indexOf(z)-CANS.indexOf(c)+23)%12]];
        document.getElementById("oNK").innerText = kv(b.getYearGan(),b.getYearZhi());
        document.getElementById("oNJK").innerText = kv(b.getDayGan(),b.getDayZhi());

        // 3. THẦN SÁT ENGINE
        const getTS_Col=(pillarIdx)=>{
            let s=[];
            const curI = [b.getTimeZhi(), b.getDayZhi(), b.getMonthZhi(), b.getYearZhi()][pillarIdx];
            const curC = [b.getTimeGan(), b.getDayGan(), b.getMonthGan(), b.getYearGan()][pillarIdx];
            const yi=b.getYearZhi(), di=b.getDayZhi(), dc=b.getDayGan(), yc=b.getYearGan(), mi=b.getMonthZhi();
        
		// NIÊN THẦN 
        if(yi === curI) s.push({n:"Thái Tuế", h:1});
            // Logic các sao
			
            const TA={"甲":"丑未","戊":"丑未","庚":"丑未","乙":"子申","己":"子申","丙":"亥酉","丁":"亥酉","壬":"卯巳","癸":"卯巳"};
            if(TA[dc] && TA[dc].includes(curI)) s.push({n:"Thiên Ất", h:0});
            const DM={"申":"寅","子":"寅","辰":"寅","寅":"申","午":"申","戌":"申","亥":"巳","卯":"巳","未":"巳","巳":"亥","酉":"亥","丑":"亥"};
            if(DM[yi] === curI || DM[di] === curI) s.push({n:"Dịch Mã", h:0});
            const TT={"子":"子","辰":"子","申":"子","午":"午","寅":"午","戌":"午","卯":"卯","亥":"卯","未":"卯","酉":"酉","巳":"酉","丑":"酉"};
            if(TT[yi] === curI) s.push({n:"Tướng Tinh", h:0});
            const TS={"子":"午","辰":"午","申":"午","午":"子","寅":"子","戌":"子","卯":"酉","亥":"酉","未":"酉","酉":"卯","巳":"卯","丑":"卯"};
            if(TS[yi] === curI) s.push({n:"Tai Sát", h:1});
            const KS={"申":"巳","子":"巳","辰":"巳","寅":"亥","午":"亥","戌":"亥","巳":"寅","酉":"寅","丑":"寅","亥":"申","卯":"申","未":"申"};
            if(KS[yi] === curI) s.push({n:"Kiếp Sát", h:1});
            const QUATU={
 "亥":"辰","子":"辰","丑":"辰",
 "寅":"未","卯":"未","辰":"未",
 "巳":"戌","午":"戌","未":"戌",
 "申":"丑","酉":"丑","戌":"丑"
};
if(QUATU[yi] === curI) s.push({n:"Quả Tú", h:1});
            const DH={"子":"午","午":"子","丑":"未","未":"丑","寅":"申","申":"寅","卯":"酉","酉":"卯","辰":"戌","戌":"辰","巳":"亥","亥":"巳"};
            if(DH[yi] === curI) s.push({n:"Đại Hao", h:1});
           
            const LT={"甲":"寅","乙":"卯","丙":"巳","丁":"午","戊":"巳","己":"午","庚":"申","辛":"酉","壬":"亥","癸":"子"};
const XUNG={"子":"午","午":"子","丑":"未","未":"丑","寅":"申","申":"寅","卯":"酉","酉":"卯","辰":"戌","戌":"辰","巳":"亥","亥":"巳"};
if(XUNG[yi] === curI) s.push({n:"Tuế Phá", h:1});
const TANGMON={"子":"寅","丑":"卯","寅":"辰","卯":"巳","辰":"午","巳":"未","午":"申","未":"酉","申":"戌","酉":"亥","戌":"子","亥":"丑"};
if(TANGMON[yi] === curI) s.push({n:"Tang Môn", h:1});
const BACHHO={"子":"申","丑":"酉","寅":"戌","卯":"亥","辰":"子","巳":"丑","午":"寅","未":"卯","申":"辰","酉":"巳","戌":"午","亥":"未"};
if(BACHHO[yi] === curI) s.push({n:"Bạch Hổ", h:1});
const PHUC={"子":"巳","丑":"午","寅":"未","卯":"申","辰":"酉","巳":"戌","午":"亥","未":"子","申":"丑","酉":"寅","戌":"卯","亥":"辰"};
if(PHUC[yi] === curI) s.push({n:"Phúc Đức", h:0});
const HOACAI={
 "申":"辰","子":"辰","辰":"辰",
 "寅":"戌","午":"戌","戌":"戌",
 "亥":"未","卯":"未","未":"未",
 "巳":"丑","酉":"丑","丑":"丑"
};
if(HOACAI[yi] === curI) s.push({n:"Hoa Cái", h:0});
const COTHAN={
 "亥":"寅","子":"寅","丑":"寅",
 "寅":"巳","卯":"巳","辰":"巳",
 "巳":"申","午":"申","未":"申",
 "申":"亥","酉":"亥","戌":"亥"
};
if(COTHAN[yi] === curI) s.push({n:"Cô Thần", h:1});
// ===== NGUYỆT THẦN =====

// Thiên Đức
const THIEN_DUC={
 "寅":"丁","卯":"申","辰":"壬","巳":"辛",
 "午":"亥","未":"甲","申":"癸","酉":"寅",
 "戌":"丙","亥":"乙","子":"巳","丑":"庚"
};
if(curC === THIEN_DUC[mi]) s.push({n:"Thiên Đức", h:0});

// Nguyệt Đức
const NGUYET_DUC={
 "寅":"丙","卯":"甲","辰":"壬","巳":"庚",
 "午":"丙","未":"甲","申":"壬","酉":"庚",
 "戌":"丙","亥":"甲","子":"壬","丑":"庚"
};
if(curC === NGUYET_DUC[mi]) s.push({n:"Nguyệt Đức", h:0});

// Nguyệt Sát (hung)
const NGUYET_SAT={
 "寅":"申","卯":"酉","辰":"戌","巳":"亥",
 "午":"子","未":"丑","申":"寅","酉":"卯",
 "戌":"辰","亥":"巳","子":"午","丑":"未"
};
if(NGUYET_SAT[mi] === curI) s.push({n:"Nguyệt Sát", h:1});

            if(ZHIS[(ZHIS.indexOf(LT[dc])+1)%12] === curI) s.push({n:"Kình Dương", h:1});
            const THAP_AC=[
 "甲辰","乙巳","丙申","丁亥",
 "戊戌","己丑","庚辰","辛巳",
 "壬申","癸亥"
];

if(pillarIdx === 1 && THAP_AC.includes(dc+di)){
    s.push({n:"Thập Ác", h:1});
}

            return s;
        };
        function renderTS(arr){
    return arr.map(x=>`<span class='ts-val ${x.h?'hung-sao':''}'>${x.n}</span>`).join('');
}
		document.getElementById("tsT").innerHTML = renderTS(getTS_Col(0));
document.getElementById("tsD").innerHTML = renderTS(getTS_Col(1));
document.getElementById("tsM").innerHTML = renderTS(getTS_Col(2));
document.getElementById("tsN").innerHTML = renderTS(getTS_Col(3));
        // ===== THÂN VỰC & SCORING =====
        let allStars = [];
        for(let i=0;i<4;i++){ getTS_Col(i).forEach(x=> allStars.push(x.n)); }

        // Ngũ hành (có tàng can)
        let nguhanh = calcNguHanh(b);
        document.getElementById("elementUI").innerHTML = renderElementUI(nguhanh);

        // Thân vượng / nhược
        let thanLuc = calcThanLuc(b);
        document.getElementById("thanLucUI").innerHTML = renderThanLucUI(thanLuc, dm);

        // Dụng Thần (dựa vào Thân vượng/nhược + hành Nhật Chủ)
        const dmE = E[dm];
        let dt = findDungThan(nguhanh, thanLuc.level, dmE);
        document.getElementById("dungThanUI").innerHTML = renderDungThanUI(dt);

        // Điểm mệnh thân
        let score = calcScore(b, allStars);
        document.getElementById("scoreUI").innerHTML = renderScoreUI(score);

        // ===== LUẬN GIẢI TỔNG QUÁT =====
        document.getElementById("ct-tinhcach").innerHTML = luanTinhCach(dm, thanLuc, gNam);
        document.getElementById("ct-suckhoe").innerHTML  = luanSucKhoe(dm, nguhanh);
        document.getElementById("ct-giadinh").innerHTML  = luanGiaDinh(dm, b, gNam, allStars);
        document.getElementById("ct-congviec").innerHTML = luanCongViec(dm, dt, nguhanh, allStars);
       
	   // --- KHÔI PHỤC ĐẠI VẬN & LƯU NIÊN ---
        
        // 1. Xác định chiều vận
        const yearGan_fix = b.getYearGan(); 
        const isMale_fix = (gNam === 1);
        const isDuongYear_fix = ["甲","丙","戊","庚","壬"].includes(yearGan_fix);
        const dir_fix = (isMale_fix === isDuongYear_fix) ? 1 : -1;
        const fw_fix = (dir_fix === 1); 

        // 2. Tính số năm khởi vận (sA_fix)
        const jq_fix = lunar.getJieQiTable();
        const TIET_LIST = ["小寒","立春","惊蛰","驚蛰","清明","立夏","芒种","芒種","小暑","立秋","白露","寒露","立冬","大雪"];
        
        let list_TK = Object.entries(jq_fix)
            .filter(([k]) => TIET_LIST.includes(k))
            .map(([,v]) => v)
            .sort((a,b) => a.getJulianDay() - b.getJulianDay());

        if(list_TK.length < 6) {
            list_TK = Object.values(jq_fix)
                .sort((a,b) => a.getJulianDay() - b.getJulianDay())
                .filter((_,i) => i % 2 === 0); 
        }

        let sA_fix = 3; // Khai báo mặc định để tránh lỗi "is not defined"
        if(list_TK.length > 0) {
            const target = fw_fix
                ? list_TK.find(v => v.getJulianDay() > solar.getJulianDay())
                : [...list_TK].reverse().find(v => v.getJulianDay() <= solar.getJulianDay());
            if(target) {
                const daysDiff = Math.abs(target.getJulianDay() - solar.getJulianDay());
                sA_fix = Math.max(1, Math.round(daysDiff / 3));
            }
        }

        // 3. Hiển thị Đại vận
        let html_DV = "";
        for(let i = 0; i < 8; i++) {
            const cI = (CANS.indexOf(b.getMonthGan()) + dir_fix * (i + 1) + 10) % 10;
            const zI = (ZHIS.indexOf(b.getMonthZhi()) + dir_fix * (i + 1) + 12) % 12;
            const age_start = sA_fix + i * 10;
            const year_start = y + age_start;
            const current_year = new Date().getFullYear();
            const isActive = current_year >= year_start && current_year < year_start + 10;

            html_DV += `<div class="card ${isActive ? 'active-v' : ''}">
                <div>${year_start}</div>
                <b>
                    <span class="${E[CANS[cI]]}">${VN[CANS[cI]]}</span> 
                    <span class="${E[ZHIS[zI]]}">${VN[ZHIS[zI]]}</span>
                </b>
                <div style="font-size:11px;color:#aaa;margin-top:2px">${age_start} tuổi</div>
            </div>`;
        }

        // 4. Hiển thị Lưu niên
        let html_LN1 = "", html_LN2 = "";
        for(let i = 0; i < 20; i++) {
            const l_year = new Date().getFullYear() + i;
            const l_lunar = Lunar.fromSolar(Solar.fromYmd(l_year, 6, 15));
            const card_item = `<div class="card">
                <div>${l_year}</div>
                <b><span class="${E[l_lunar.getYearGan()]}">${VN[l_lunar.getYearGan()]}</span> <span class="${E[l_lunar.getYearZhi()]}">${VN[l_lunar.getYearZhi()]}</span></b>
            </div>`;
            if(i < 10) html_LN1 += card_item; else html_LN2 += card_item;
        }

        // Đổ dữ liệu vào HTML
        document.getElementById("dv").innerHTML = html_DV;
        document.getElementById("ln1").innerHTML = html_LN1;
        document.getElementById("ln2").innerHTML = html_LN2;

        // ===== LUẬN ĐẠI VẬN & LƯU NIÊN =====
        const currentYear = new Date().getFullYear();
        document.getElementById("ct-daivan").innerHTML  = luanDaiVan(dm, b, sA_fix, dir_fix, currentYear, y);
        document.getElementById("ct-luunien").innerHTML = luanLuuNien(dm, b, currentYear);

    } catch (e) {
        console.error("Lỗi thực thi:", e);
    }
}
</script>
